version: "3.9"

# Shared DB/WordPress env for the wordpress + wpcli containers.
# By default the site uses the remote MySQL defined by DB_HOST in .env (e.g. Aiven).
# To use the bundled local MariaDB instead: set DB_HOST=db, DB_SSL=false and run
# `docker compose --profile local-db up -d`.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: "${DB_HOST:-db}"
  WORDPRESS_DB_NAME: "${DB_NAME:-safari_wp}"
  WORDPRESS_DB_USER: "${DB_USER:-safari}"
  WORDPRESS_DB_PASSWORD: "${DB_PASSWORD:-safari_secret}"
  WORDPRESS_DB_SSL: "${DB_SSL:-false}"
  WORDPRESS_TABLE_PREFIX: "${DB_PREFIX:-stv_}"
  WORDPRESS_DEBUG: "${WP_DEBUG:-true}"
  WORDPRESS_DEBUG_LOG: "true"
  WORDPRESS_DEBUG_DISPLAY: "false"
  WORDPRESS_CONFIG_EXTRA: |
    define('DISALLOW_FILE_EDIT', true);
    define('WP_CACHE', true);
    define('WP_ENVIRONMENT_TYPE', '${WP_ENV:-local}');
    if (filter_var(getenv_docker('WORDPRESS_DB_SSL', 'false'), FILTER_VALIDATE_BOOLEAN)) {
      define('MYSQL_CLIENT_FLAGS', MYSQLI_CLIENT_SSL | MYSQLI_CLIENT_SSL_DONT_VERIFY_SERVER_CERT);
    }

services:
  # ── MariaDB (optional local DB — only with `--profile local-db`) ───────────
  db:
    image: mariadb:10.11
    container_name: safari_db
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      MYSQL_DATABASE: "${DB_NAME:-safari_wp}"
      MYSQL_USER: "${DB_USER:-safari}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-safari_secret}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis object cache ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: safari_redis
    restart: unless-stopped
    command: redis-server --save "" --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── WordPress (PHP 8.2 + Apache) ───────────────────────────────────────────
  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: safari_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/safari-theme:cached
      - ./plugins/safari-core:/var/www/html/wp-content/plugins/safari-core:cached
      - ./plugins/safari-leads:/var/www/html/wp-content/plugins/safari-leads:cached
      - ./plugins/safari-search:/var/www/html/wp-content/plugins/safari-search:cached
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:cached
      - ./uploads:/var/www/html/wp-content/uploads:cached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── WP-CLI ─────────────────────────────────────────────────────────────────
  wpcli:
    image: wordpress:cli-php8.2
    container_name: safari_wpcli
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/safari-theme:cached
      - ./plugins/safari-core:/var/www/html/wp-content/plugins/safari-core:cached
      - ./plugins/safari-leads:/var/www/html/wp-content/plugins/safari-leads:cached
      - ./plugins/safari-search:/var/www/html/wp-content/plugins/safari-search:cached
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:cached
      - ./uploads:/var/www/html/wp-content/uploads:cached
      - ./scripts:/scripts:cached
    environment: *wp-env
    user: "33:33"
    entrypoint: ["wp", "--allow-root"]
    profiles:
      - cli

  # ── Mailpit (catches all outgoing email) ───────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: safari_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: "200"
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  # ── Laravel API (optional, profile-gated) ─────────────────────────────────
  # Docker is never required: `php scripts/safari.php api-start` runs the API on
  # the host against the same database. This service exists only for parity with
  # the WordPress containers. Start it with `--profile api`.
  api:
    image: php:8.3-cli
    container_name: safari_api
    restart: unless-stopped
    profiles:
      - api
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # "db" is the bundled MariaDB profile; when using the remote Aiven database
      # set DB_HOST to its host:port and DB_SSL=true in .env instead.
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_NAME:-safari_wp}"
      DB_USERNAME: "${DB_USER:-safari}"
      DB_PASSWORD: "${DB_PASSWORD:-safari_secret}"
      DB_PREFIX: "${API_TABLE_PREFIX:-safari_api_}"
      DB_SSL: "${DB_SSL:-false}"
      API_URL: "${API_URL:-http://localhost:8000}"
      WORDPRESS_URL: "${WP_SITE_URL:-http://localhost:8080}"
      SAFARI_API_KEY: "${SAFARI_API_KEY:-}"
      SAFARI_API_MIRROR: "${API_MIRROR:-false}"
    volumes:
      - ./backend:/app
      - api_data:/app/storage
    command: >
      sh -c "composer install --no-interaction --no-progress --optimize-autoloader &&
             php artisan storage:link --force || true &&
             php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  db_data:
  wp_data:
  mailpit_data:
  api_data:
